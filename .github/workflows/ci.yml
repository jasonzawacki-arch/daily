name: ci
# Type-checks, builds and runs the Playwright browser tests on every push.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: npm install && npx tsc -p . && node build.mjs
      - run: pip install playwright pillow numpy && python -m playwright install --with-deps chromium
      - run: python tests/run_all.py
